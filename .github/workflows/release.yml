name: Publish releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to publish
        required: true
        type: string
      publish_only:
        description: Recover publication using a completed, tag-matched build
        type: boolean
        default: false
      build_run_id:
        description: Successful platform-build run for publish-only recovery
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
      reuse_packages: ${{ steps.reuse.outputs.reuse_packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag and all application versions
        id: version
        run: echo "version=$(node scripts/release-guards.mjs versions "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"
      - run: node --test scripts/release-guards.test.mjs
      - name: Require proven platform builds for publication recovery
        if: inputs.publish_only
        id: reuse
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const id = process.env.BUILD_RUN_ID;
          if (!/^[1-9][0-9]*$/.test(id || '')) throw Error('Recovery requires a platform-build run ID');
          const api = path => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          const base = `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`;
          const run = api(base);
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (run.head_sha !== sha || run.head_branch !== process.env.RELEASE_TAG || run.event !== 'push' || run.path !== '.github/workflows/release.yml' || run.status !== 'completed') throw Error('Build run must match this exact tagged source and release workflow');
          const response = api(`${base}/jobs?per_page=100`);
          if (response.total_count !== response.jobs.length) throw Error('Incomplete build evidence');
          const required = [
            // Android is always re-verified below, including recovery runs.
            // Only reuse desktop installers; never reuse an APK verification.
            'desktop (ubuntu-22.04, linux)',
            'desktop (windows-latest, windows)',
            'desktop (macos-15, macos-arm64)',
            'desktop (macos-15-intel, macos-x64)',
          ];
          for (const name of required) {
            const jobs = response.jobs.filter(job => job.name === name);
            if (jobs.length !== 1 || jobs[0].status !== 'completed' || jobs[0].conclusion !== 'success') throw Error(`Missing successful build: ${name}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'reuse_packages=true\n');
          console.log(`Verified all five build jobs on tagged source ${sha}`);
          NODE
      - name: Require successful CI on this exact commit
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          for (let attempt = 0; attempt < 120; attempt++) {
            const runs = JSON.parse(execFileSync('gh', ['run','list','--repo',process.env.GITHUB_REPOSITORY,'--workflow','ci.yml','--commit',sha,'--json','status,conclusion'],{encoding:'utf8'}));
            if (runs.some(run => run.status === 'completed' && run.conclusion === 'success')) process.exit(0);
            if (runs.some(run => run.status === 'completed' && run.conclusion !== 'success')) throw Error('CI failed on the release commit');
            await new Promise(resolve => setTimeout(resolve, 20000));
          }
          throw Error('No successful CI run found for the release commit');
          NODE
      - name: Create or reuse a protected draft
        id: draft
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            node -e 'if (!JSON.parse(require("fs").readFileSync(process.argv[1])).isDraft) throw Error("Refusing to alter an already published release")' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Super MD $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Draft release lookup did not return a valid identifier' >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    if: needs.prepare.outputs.reuse_packages != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            package: linux
          - platform: windows-latest
            package: windows
          - platform: macos-15
            package: macos-arm64
          - platform: macos-15-intel
            package: macos-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2 libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfuse2 squashfs-tools rpm ruby-dev build-essential
          sudo gem install fpm --no-document
          curl -fL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r desktop/requirements-build.txt
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./smd-core -> target
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - run: python -m unittest discover -s desktop -p "test_*.py"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: cargo test --locked --manifest-path smd-core/Cargo.toml
      - run: cargo build --locked --release --manifest-path smd-core/Cargo.toml --bin smd-engine
      - run: python desktop/package.py
      - name: Verify packaged runtime before uploading
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            desktop/dist/super-md/super-md.exe --version
            desktop/dist/super-md/_internal/resources/desktop/smd-engine.exe doctor
          else
            desktop/dist/super-md/super-md --version
            desktop/dist/super-md/_internal/resources/desktop/smd-engine doctor
          fi
          gh release upload "$RELEASE_TAG" desktop/dist/packages/* --clobber

  android:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "build-tools;36.0.0"
      - name: Install APK verifier dependency (including existing stable tags)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Select safe signing route
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/supermd-distribution.jks"
            echo "SUPERMD_KEYSTORE=$RUNNER_TEMP/supermd-distribution.jks" >> "$GITHUB_ENV"
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'No CI signing secret: requiring the locally signed release APK in this draft.'
          fi
      - uses: actions/setup-python@v5
        if: steps.signing.outputs.build == 'true'
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.signing.outputs.build == 'true'
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        if: steps.signing.outputs.build == 'true'
        with:
          workspaces: ./smd-core -> target
      - name: Build signed release variant
        if: steps.signing.outputs.build == 'true'
        env:
          SUPERMD_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SUPERMD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUPERMD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sdkmanager "platforms;android-37.0" "ndk;27.1.12297006"
          export SUPERMD_BUILD_PYTHON="$(command -v python)"
          npm ci
          npm run android:release
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Super-MD-${{ needs.prepare.outputs.version }}-arm64-release.apk"
      - name: Require locally signed APK when CI signing is not configured
        if: steps.signing.outputs.build != 'true'
        run: |
          apk_name="Super-MD-${{ needs.prepare.outputs.version }}-arm64-release.apk"
          found=false
          for attempt in $(seq 1 40); do
            if gh release download "$RELEASE_TAG" --pattern "$apk_name" --dir "$RUNNER_TEMP" --clobber; then found=true; break; fi
            sleep 15
          done
          if [ "$found" != true ]; then echo 'Missing signed release APK. Draft stays unpublished.' >&2; exit 1; fi
      - name: Verify signing, variant, alignment and tagged source identity
        run: bash scripts/verify-release-apk.sh "$RUNNER_TEMP/Super-MD-${{ needs.prepare.outputs.version }}-arm64-release.apk" "${{ needs.prepare.outputs.version }}" "$(git rev-parse HEAD)"
      - name: Attach verified APK to draft
        if: steps.signing.outputs.build == 'true'
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Super-MD-${{ needs.prepare.outputs.version }}-arm64-release.apk" --clobber

  publish:
    needs: [prepare, desktop, android]
    if: ${{ always() && needs.prepare.result == 'success' && needs.android.result == 'success' && (needs.desktop.result == 'success' || (needs.desktop.result == 'skipped' && needs.prepare.outputs.reuse_packages == 'true')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require complete installers and create package checksums
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq .assets > "$RUNNER_TEMP/assets.json"
          node scripts/release-guards.mjs assets "$RELEASE_TAG" "$RUNNER_TEMP/assets.json"
          mkdir "$RUNNER_TEMP/packages"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          for package in *; do
            if [ "$package" != SHA256SUMS ]; then sha256sum "$package"; fi
          done > "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS" --clobber
      - name: Publish only after all verified builds succeed
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file RELEASE_NOTES.md
          gh release view "$RELEASE_TAG" --json isDraft,url,assets > "$RUNNER_TEMP/public.json"
          node -e 'const release=JSON.parse(require("fs").readFileSync(process.argv[1])); if(release.isDraft || !release.assets.some(a=>a.name==="SHA256SUMS")) throw Error("Publication verification failed"); console.log(release.url)' "$RUNNER_TEMP/public.json"
