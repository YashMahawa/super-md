name: Releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "1"
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: Super MD v__VERSION__
          releaseBody: Desktop packages for Linux, macOS, and Windows. PDF export requires Pandoc and Typst. The Android APK is a debug-signed native preview with the limitations documented in README.md.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android-native-preview:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then SDK_MANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_MANAGER" ]; then echo "Android SDK manager not found" >&2; exit 1; fi
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Verify and build native preview APK
        working-directory: android-native
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --max-workers=2 --no-daemon --console=plain
      - name: Attach debug APK to draft release
        run: gh release upload "$GITHUB_REF_NAME" "android-native/app/build/outputs/apk/debug/app-debug.apk#Super-MD-Android-native-debug.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
