name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  agent_relay:
    name: agent_relay
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-relay/package-lock.json
      - run: npm ci
        working-directory: agent-relay
      - run: npm test
        working-directory: agent-relay

  native_frontend:
    name: native_frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Record exact checked-out source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - name: Inventory required native reader resources
        run: node scripts/report-web-assets.mjs dist --verify-native --public-root public --output "$RUNNER_TEMP/reader-assets-report.json"
      - name: Test and create exact-source native frontend manifest
        run: |
          node --test scripts/native-frontend-artifact.test.mjs
          node --test scripts/wait-native-frontend-artifacts.test.mjs
          node scripts/native-frontend-artifact.mjs create dist "$RUNNER_TEMP/native-frontend-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-frontend-dist-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-frontend-manifest-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/native-frontend-manifest.json
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Record exact checked-out source SHA
        id: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "NATIVE_FRONTEND_SOURCE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-randr0 libxcb-xfixes0 libxcb-xkb1 libxcb-util1 libwayland-client0 libwayland-cursor0 libwayland-server0 libxkbcommon-x11-0 libegl1 libgl1 xdg-utils poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compute Python wheel cache identity
        id: python-wheel-identity
        shell: bash
        run: |
          digest="$(python scripts/python_wheel_identity.py desktop/requirements.txt desktop/requirements-build.txt desktop/requirements-agent.txt)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: python-wheels
        with:
          path: ${{ runner.temp }}/supermd-python-wheels
          key: python-wheelhouse-v3-${{ steps.python-wheel-identity.outputs.digest }}
      - name: Validate or rebuild the platform-specific Python wheelhouse
        shell: bash
        env:
          WHEELHOUSE: ${{ runner.temp }}/supermd-python-wheels
          PYTHON_WHEEL_CACHE_HIT: ${{ steps.python-wheels.outputs.cache-hit }}
        run: |
          python scripts/prepare_python_wheelhouse.py "$WHEELHOUSE" desktop/requirements-build.txt desktop/requirements.txt desktop/requirements-build.txt desktop/requirements-agent.txt
          python - <<'PY'
          import json, os, platform, sys
          from pathlib import Path

          wheels = sorted(Path(os.environ["WHEELHOUSE"]).glob("*.whl"))
          report = {
              "cacheHit": os.environ["PYTHON_WHEEL_CACHE_HIT"],
              "python": sys.version,
              "platform": sys.platform,
              "architecture": platform.machine(),
              "wheelCount": len(wheels),
              "wheels": [{"name": wheel.name, "bytes": wheel.stat().st_size} for wheel in wheels],
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "python-wheel-inventory.json"
          output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(f"wheel_cache_hit={report['cacheHit']} wheel_count={report['wheelCount']}")
          PY
      - run: python -m unittest scripts.test_prepare_python_wheelhouse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./smd-core -> target
          shared-key: native-desktop-${{ runner.os }}-${{ runner.arch }}
      - run: npm ci
      - run: npx tsc -b --pretty false
      - name: Build the relay for cross-platform Qt/MCP integration tests
        run: npm ci --prefix agent-relay && npm run build --prefix agent-relay
      - name: Wait for same-run frontend artifacts for this checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-native-frontend-artifacts.mjs "$NATIVE_FRONTEND_SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-dist-${{ steps.source.outputs.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-manifest-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}
      - name: Verify exact-source frontend artifact
        shell: bash
        run: node scripts/native-frontend-artifact.mjs verify dist "$RUNNER_TEMP/native-frontend-manifest.json"
      - name: Inventory native reader bundle reachability and fonts
        shell: bash
        run: node scripts/report-web-assets.mjs dist --verify-native --public-root public --output "$RUNNER_TEMP/reader-assets-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: build-inventory-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/reader-assets-report.json
            ${{ runner.temp }}/python-wheel-inventory.json
      - run: node --test scripts/release-guards.test.mjs
      - run: npx vitest run
      - run: npm run test:pdf
      - run: cargo build --locked --release --manifest-path smd-core/Cargo.toml --bin smd-engine
      - name: Test native state, file safety, themes and actual Qt menu geometry
        timeout-minutes: 8
        run: python desktop/run_tests.py
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - run: python desktop/package.py --bundle-only
      - name: Verify the packaged MCP stdio entry point with the official client
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            binary=desktop/dist/super-md/super-md-cli.exe
          elif [ "$RUNNER_OS" = macOS ]; then
            binary="desktop/dist/Super MD.app/Contents/MacOS/super-md"
          else
            binary=desktop/dist/super-md/super-md
          fi
          python desktop/check_packaged_mcp.py "$binary"
      - name: Check packaged runtime identity and native PDF engine
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            desktop/dist/super-md/super-md.exe --version
          python desktop/check_bundled_python.py desktop/dist/super-md/super-md.exe
            desktop/dist/super-md/_internal/resources/desktop/smd-engine.exe doctor
          else
            desktop/dist/super-md/super-md --version
          if [ "$RUNNER_OS" = macOS ]; then python desktop/check_bundled_python.py desktop/dist/super-md/super-md; fi
            desktop/dist/super-md/_internal/resources/desktop/smd-engine doctor
          fi
      - name: Recover the packaged reader after an isolated renderer failure
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: node desktop/test_reader_crash_recovery_integration.mjs --binary desktop/dist/super-md/super-md
      - name: Launch packaged editor and verify real reader pixels and math PDF
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$RUNNER_OS" = Windows ]; then binary=desktop/dist/super-md/super-md.exe; else binary=desktop/dist/super-md/super-md; fi
          python desktop/check_packaged.py "$binary" "$version" --graphics software

  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      # Keep the constrained local default at one worker (playwright.config.ts);
      # CI uses two based on same-source 68-test measurements.
      - run: npm run test:browser -- --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/

  android-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006"
      - uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper/dists
          key: gradle-linux-jdk17-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/gradle/dependency-locks/**') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./smd-core -> target
      - run: npm ci
      - name: Configure optional distribution signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/supermd-distribution.jks"
            echo "SUPERMD_KEYSTORE=$RUNNER_TEMP/supermd-distribution.jks" >> "$GITHUB_ENV"
          fi
          echo "SUPERMD_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "SUPERMD_BUILD_CPUS=$(awk '/Cpus_allowed_list/ {print $2}' /proc/self/status)" >> "$GITHUB_ENV"
      - name: Build and validate release variant (never debug distribution)
        run: npm run android:release
        env:
          SUPERMD_GRADLE_BUILD_CACHE: 'false'
          SUPERMD_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SUPERMD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUPERMD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Report Gradle dependency cache restoration
        run: echo "gradle_dependency_cache_hit=${{ steps.gradle-cache.outputs.cache-hit }}; task_output_cache=disabled_for_signed_release"
      - name: Lint debug and instrumentation sources without suppressing render assertions
        working-directory: android
        run: ./gradlew --no-daemon --build-cache --max-workers=2 :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: super-md-android-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/lint-results-debug.html

  compiler-canary:
    name: tsc-ts canary (${{ matrix.platform }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned experimental compiler in an isolated prefix
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/tsc-ts" --no-save --ignore-scripts --package-lock=false --no-audit --no-fund tsc-ts@0.0.5
      - name: Compare project build and negative diagnostics with the TypeScript 5.9 baseline
        shell: bash
        run: node scripts/verify-tsc-ts-canary.mjs "$RUNNER_TEMP/tsc-ts/node_modules/tsc-ts/bin/tsc-ts.js"

  android-device-tests:
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      SUPERMD_ABIS: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Record exact checked-out source SHA
        id: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "NATIVE_FRONTEND_SOURCE_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006"
      - uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper/dists
          key: gradle-linux-jdk17-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/gradle/dependency-locks/**') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./smd-core -> target
          shared-key: android-emulator-${{ runner.os }}
          # Preserve compiled dependencies even when a UI assertion fails.
          # Every emulator assertion still runs before the release can pass.
          cache-on-failure: true
      - run: npm ci
      - run: npx tsc -b --pretty false
      - name: Wait for same-run frontend artifacts for this checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-native-frontend-artifacts.mjs "$NATIVE_FRONTEND_SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-dist-${{ steps.source.outputs.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-manifest-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}
      - name: Verify exact-source frontend artifact
        shell: bash
        run: node scripts/native-frontend-artifact.mjs verify dist "$RUNNER_TEMP/native-frontend-manifest.json"
      - name: Build the real JNI engine and offline reader for instrumentation
        run: |
          export NDK_BIN="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          cargo rustc --locked --release --target x86_64-linux-android --manifest-path smd-core/Cargo.toml --lib -- -C link-arg=-Wl,-z,max-page-size=16384
          mkdir -p android/app/src/main/jniLibs/x86_64 android/app/src/main/assets/web
          cp smd-core/target/x86_64-linux-android/release/libsmd_core.so android/app/src/main/jniLibs/x86_64/
          cp -a dist/. android/app/src/main/assets/web/
          echo "SUPERMD_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          # An OS-owned first-use immersive education window intercepts native
          # pointer injections even though DOM hit testing sees the document.
          # Acknowledge it ONLY on this disposable emulator, before launching
          # the app. This leaves every native tap, pinch and paint assertion on.
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            android/gradlew -p android --no-daemon --build-cache --max-workers=2 :app:connectedDebugAndroidTest
      - name: Report Gradle dependency cache restoration
        run: echo "gradle_cache_hit=${{ steps.gradle-cache.outputs.cache-hit }}; task output reuse is reported by Gradle FROM-CACHE task lines"
      # Debug is an internal test harness only, never a distributed APK.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results-api-${{ matrix.api-level }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

  release-gate:
    name: All release tests passed
    if: always()
    needs: [test, browser, android-release, android-device-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failures, cancellations and skipped test families
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(results)) { if(job.result!=="success") throw Error(`${name}: ${job.result}`); } console.log("All platform, browser, PDF and Android emulator tests passed");'
