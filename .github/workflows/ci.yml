name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: npm test

  android-native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then SDK_MANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_MANAGER" ]; then echo "Android SDK manager not found" >&2; exit 1; fi
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build native Android APK
        working-directory: android-native
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --max-workers=2 --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: super-md-android-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
