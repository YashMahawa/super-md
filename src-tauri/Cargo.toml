[package]
name = "super-md"
version = "0.4.13"
description = "A distraction-free, interactive Markdown studio"
authors = ["Yash Mahawar", "Super MD contributors"]
license = "MIT"
repository = "https://github.com/YashMahawa/super-md"
edition = "2021"
rust-version = "1.92"

[lib]
name = "super_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "super-md"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
meval = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
which = "8"
smd-core = { path = "../smd-core" }

[profile.dev]
debug = 0

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[profile.release]
codegen-units = 8
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
