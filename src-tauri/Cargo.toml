[package]
name = "super-md"
version = "0.1.4"
description = "A distraction-free, interactive Markdown studio"
authors = ["Super MD contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "super_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "super-md"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
meval = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
which = "8"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
