[package]
name = "smd-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
mitex = "0.2.4"
typst = "0.15"
typst-pdf = "0.15"
typst-as-lib = { version = "0.16", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
debug = 0
strip = true
codegen-units = 8
