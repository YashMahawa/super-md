[package]
name = "smd-core"
version = "0.6.34"
edition = "2021"
authors = ["Yash Mahawar", "Super MD contributors"]
license = "MIT"
repository = "https://github.com/YashMahawa/super-md"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
roxmltree = "=0.21.1"
imagesize = "=0.14.0"
mitex = "0.2.4"
typst = "0.15"
typst-pdf = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["embedded-fonts", "datetime"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"

[dev-dependencies]
# Audit the same command inventory already embedded by MiTeX; test-only.
mitex-spec-gen = "=0.2.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
typst-kit = { version = "0.15", default-features = false, features = ["scan-fonts"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
debug = 0
strip = true
codegen-units = 8
